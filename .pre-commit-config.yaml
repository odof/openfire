default_language_version:
  python: python3
repos:
  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0 # pick a git hash / tag to point to
    hooks:
      - id: flake8
        additional_dependencies: [flake8-print]
        # E203: whitespace before ':' is no more PEP8 compliant and it enter in conflict with Black
        args:
          [
            "--enable=T",
            "--max-line-length=120",
            "--select=E,W,F",
            "--ignore=W503,W504,E203",
          ]
        exclude: __(init|manifest)__.py
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-ast
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: fix-encoding-pragma
        args: ["--remove"]
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (python)
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3
        exclude: __(init|manifest)__.py
        args: [--line-length=120]
  - repo: https://github.com/PyCQA/bandit
    rev: "1.7.5"
    hooks:
      - id: bandit
        # B101: Assert and compilation. We don't compile Python code.
        # B404: We are aware of the security implications associated with subproces
        args: [--skip=B101, B404]
  - repo: https://gitlab.openfire.fr/odoo/commit-hooks
    rev: v0.1.0
    hooks:
    - id: check-commit-message
