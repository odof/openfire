image: "python:3.9"

before_script:
  - python --version
  - pip install flake8 flake8-print isort pylint black

stages:
  - linting

isort:
  stage: linting
  script:
    - isort . --check-only

flake8:
  stage: linting
  script:
    - flake8 .

black:
  stage: linting
  script:
    - black . --check --skip-string-normalization --line-length 120 --force-exclude="__(init|manifest)__\.py"
